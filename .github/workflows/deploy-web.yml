name: Deploy Web
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v2
        with:
          go-version: '^1.21'
      - run: go build -o web/game.wasm
        env:
          GOOS: js
          GOARCH: wasm
      - run: cp $(go env GOROOT)/misc/wasm/wasm_exec.js web/

      - uses: actions/configure-pages@v2
      - uses: actions/upload-pages-artifact@v1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v1

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v2
      with:
        go-version: '^1.21'
    - run: sudo apt-get update
    - run: sudo apt-get install libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev libasound2-dev libudev-dev libxxf86vm-dev
    - run: mkdir out
    - run: go build -o out/Kingdoms_linux_amd64
      env:
        GOOS: linux
        GOARCH: amd64
    - uses: ncipollo/release-action@v1
      with:
        artifacts: "out/*"
